name: LeetCode Auto Sync

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Backfill all solved LeetCode problems and heatmap"
        required: true
        default: false
        type: boolean

  push:
    paths:
      - "scripts/leetcode_sync.py"
      - ".github/workflows/leetcode_sync.yml"

  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync LeetCode
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync || 'false' }}
        run: python scripts/leetcode_sync.py
