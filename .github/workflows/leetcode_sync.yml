name: LeetCode Auto Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync LeetCode
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/leetcode_sync.py

      - name: Commit changes
        run: |
          git config user.name "LeetCode Sync"
          git config user.email "leetcode-sync@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No new submissions."
          else
            git commit -m "Sync LeetCode submissions"
            git push
          fi
